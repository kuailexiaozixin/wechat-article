name: verify

# 只做一件事：在大小写敏感的文件系统上跑 tests/run_all.py。
# 判据全部离线，不联网、不调用任何微信接口、不需要凭据。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  judges:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 判据全量（失败即退出码非 0）
        working-directory: skills/wechat-article
        run: python tests/run_all.py
